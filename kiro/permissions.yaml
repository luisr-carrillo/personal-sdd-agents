rules:
  - capability: shell
    match:
      - "*>*"
      - "*<*"
      - "*|*"
      - "*;*"
      - "*&&*"
      - "*||*"
      - "*$(*"
      - "*`*"
      - "git log *--output*"
      - "git log *--ext-diff*"
      - "git log *--textconv*"
      - "git log *--show-signature*"
      - "git log *--alternate-refs*"
      - "git show *--output*"
      - "git show *--ext-diff*"
      - "git show *--textconv*"
      - "git show *--show-signature*"
      - "git diff *--output*"
      - "git diff *--ext-diff*"
      - "git diff *--textconv*"
      - "git diff *--no-index*"
    effect: ask
  - capability: shell
    match:
      - "pwd"
      - "ls"
      - "git status"
      - "git status *"
      - "git branch"
      - "git branch --show-current"
      - "git log"
      - "git log *"
      - "git show"
      - "git show *"
      - "git diff"
      - "git diff *"
      - "git rev-parse *"
      - "git ls-files"
      - "git ls-files *"
      - "git ls-tree *"
      - "git merge-base *"
      - "git name-rev *"
      - "git describe"
      - "git describe *"
      - "git show-ref"
      - "git show-ref *"
      - "git tag"
      - "git remote"
      - "git remote -v"
      - "git reflog"
      - "git reflog show *"
      - "git shortlog"
      - "git shortlog *"
      - "git --no-pager --no-optional-locks status --short"
      - "git --no-pager --no-optional-locks branch --show-current"
      - "git --no-pager --no-optional-locks rev-parse HEAD"
      - "git --no-pager --no-optional-locks rev-parse --show-toplevel"
      - "git --no-pager --no-optional-locks rev-parse --is-inside-work-tree"
      - "git --no-pager --no-optional-locks ls-files"
    effect: allow
